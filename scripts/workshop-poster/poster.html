<!doctype html>
<!-- ─── WORKSHOP POSTER · feed / story / og ───
     One file, three posters, chosen by the URL hash:
       #feed  1080×1350   Instagram feed, WhatsApp forward
       #story 1080×1920   WhatsApp status, Instagram story
       #og    1200×630    the link preview when /workshop is shared

     Why one HTML file and headless Chrome, not a design tool: the words
     must come from lib/workshop.js (qr.js writes them in below as JSON),
     and the site's own fonts render here exactly as they do on the
     site. Re-running make.ps1 after a copy change re-prints every poster
     in seconds; nobody has to remember to re-export a canvas by hand.

     Why each format has its own markup instead of one layout stretched:
     a story is watched for three seconds with the top and bottom
     200-odd pixels under the app's chrome; a feed post is read at
     thumbnail size in a grid; a link preview is 1.9:1 and mostly seen at
     a few hundred pixels wide. The hook has to win in all three, so it
     is re-set for each shape, and each shape drops what it cannot carry.

     Why the katana cut is computed, not drawn: after the fonts load and
     the hook is fitted, the blade is aimed at the top of the last letter
     of MARKSHEET and drawn down-left at a shallow angle, so it slices
     that one word — the thing the poster argues against — and nothing
     else. The subhead is then tucked under the right half of the word,
     clear of the blade, and the lower-left becomes a deliberate void for
     the broken glass. Change the copy and the cut re-aims itself.

     How the cut is made: everything under the glass is rendered twice,
     each copy clipped to one side of the blade, and the lower copy slides
     a few pixels along it. No image editing; the type stays vector-sharp.
     The ember bloom sits under the type so the sliced letters stay
     legible; only the white-hot edge and the sparks sit on top.

     Why it is honest: every line is read from the source of truth. No
     seat count, no price rise, no result, no testimonial, no name —
     lib/workshop.js has none of those, so neither does this. -->

<style>
  /* Tokens mirror app/globals.css; the forge colours are the portal's. */
  :root {
    --ink: #081428; --ink-2: #0D1C34; --ink-3: #142946;
    --bone: #E8F0F7; --bone-dim: rgba(232, 240, 247, .76); --hairline: rgba(232, 240, 247, .12);
    --accent: #D2B463; --accent-light: #EBD9A8; --accent-dark: #9C8138;
    --ember: #FF7A1A; --hot: #FFB347; --white-hot: #FFE7A8; --hanko: #B3261E;
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-ui: 'Inter', 'Segoe UI', system-ui, sans-serif;
    --font-hand: 'Caveat', 'Segoe Print', cursive;
    --W: 1080px; --H: 1350px;
  }
  html, body { margin: 0; padding: 0; background: #050d1c; }
  body { width: var(--W); height: var(--H); overflow: hidden; position: relative;
         -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }

  /* Cormorant's default figures are old-style, where a 1 is a small-cap
     I and "1 October" reads "I October" at thumbnail size. Lining, always. */
  #wp-poster { position: absolute; inset: 0; overflow: hidden; background: #040a16; }
  #wp-poster *, .wp-defs text { font-variant-numeric: lining-nums; font-feature-settings: 'lnum' 1; }
  .wp-half { position: absolute; inset: 0; }
  .wp-art, .wp-front { position: absolute; left: 0; top: 0; display: block; pointer-events: none; }

  /* ── shared type ── */
  .wp-c { position: absolute; inset: 0; box-sizing: border-box; display: flex; flex-direction: column;
          color: var(--bone); font-family: var(--font-ui); }
  .wp-c p { margin: 0; }
  .wp-rs { font-family: var(--font-ui); font-weight: 600; font-size: .86em; margin-right: .06em; }  /* ₹ from Inter: not every face has it */

  .wp-top { display: flex; justify-content: space-between; align-items: center;
            font: 600 15px/1 var(--font-ui); letter-spacing: .36em; text-transform: uppercase; }
  .wp-brand { color: var(--accent); }
  .wp-place { color: var(--bone-dim); letter-spacing: .28em; }

  .wp-kick { display: flex; align-items: center; gap: 18px; font: 800 21px/1 var(--font-ui);
             letter-spacing: .3em; text-transform: uppercase; color: var(--hot); }
  .wp-kick::before { content: ''; width: 58px; height: 2px; background: linear-gradient(90deg, rgba(255,122,26,0), var(--ember)); }

  .wp-hook { margin: 0; font-family: var(--font-display); font-weight: 700; text-transform: uppercase;
             line-height: .82; letter-spacing: .004em; filter: drop-shadow(0 10px 30px rgba(0, 0, 0, .55)); }
  .wp-l { display: block; width: max-content; white-space: nowrap; }
  .wp-l-bone { color: #EEF3F8; }
  .wp-gold { background: linear-gradient(180deg, #FBEFC9 0%, #EAD08A 30%, #D2B463 56%, #B39346 80%, #8F7532 100%);
             -webkit-background-clip: text; background-clip: text; color: transparent; }

  .wp-sub { font: italic 500 46px/1.08 var(--font-display); color: var(--bone); letter-spacing: .005em;
            text-align: right; text-wrap: balance; }

  .wp-hing { font-family: var(--font-hand); font-weight: 700; transform: rotate(-2.2deg); transform-origin: 0 50%; }
  .wp-h1 { display: block; color: #F5EFE0; line-height: 1; }
  .wp-h2 { position: relative; display: inline-block; line-height: 1.02; padding: 0 .12em 0 0; }
  .wp-h2 b { position: relative; font-weight: 700; background: linear-gradient(180deg, #FFF0C4 0%, #FFB347 48%, #FF7A1A 100%);
             -webkit-background-clip: text; background-clip: text; color: transparent; padding: .08em .1em .12em 0; }
  .wp-brush { position: absolute; left: -.08em; right: 0; bottom: -.1em; width: 100%; height: .26em; overflow: visible; }

  .wp-lives { display: flex; align-items: center; flex-wrap: nowrap; gap: 16px;
              font: 700 21px/1 var(--font-ui); letter-spacing: .2em; text-transform: uppercase; color: var(--accent-light); }
  .wp-life { display: inline-flex; align-items: baseline; gap: 9px; white-space: nowrap; }
  .wp-life i { font: italic 600 22px/1 var(--font-display); letter-spacing: .02em; color: var(--ember); text-transform: none; }
  .wp-dot { width: 5px; height: 5px; transform: rotate(45deg); background: var(--accent-dark); flex: none; }
  .wp-host { font: italic 500 34px/1.1 var(--font-display); color: var(--bone); }
  .wp-ends { font: 400 23px/1.4 var(--font-ui); color: var(--bone-dim); }
  .wp-ends em { font-style: normal; font-weight: 700; color: var(--accent-light); }
  /* stories · songs · work — three short verses, the second and third warmer */
  .wp-triad { display: flex; flex-wrap: wrap; gap: 0 18px; font: italic 600 31px/1.25 var(--font-display); color: #fff; }
  .wp-triad span:nth-child(2) { color: var(--accent-light); }
  .wp-triad span:nth-child(3) { color: #FFB347; }

  .wp-wd { font: 800 20px/1 var(--font-ui); letter-spacing: .34em; text-transform: uppercase; color: var(--hot); }
  .wp-date { font-family: var(--font-display); font-weight: 700; line-height: .9; letter-spacing: -.005em; white-space: nowrap;
             padding-bottom: .06em; }
  .wp-money { display: flex; align-items: center; gap: 22px; }
  .wp-money-t > b { display: block; font: 700 32px/1.1 var(--font-display); color: var(--bone); letter-spacing: .01em; }
  .wp-money-t > span { display: block; font: 500 18px/1.35 var(--font-ui); color: var(--bone-dim); margin-top: 6px; }
  .wp-hanko { display: block; flex: none; filter: drop-shadow(0 6px 18px rgba(179, 38, 30, .35)); }

  .wp-scan { display: flex; flex-direction: column; align-items: center; }
  .wp-scan-l { font: 800 17px/1 var(--font-ui); letter-spacing: .3em; text-transform: uppercase; color: var(--hot); }
  .wp-url { font: 600 17px/1 var(--font-ui); color: var(--bone); letter-spacing: .02em; }
  .wp-wa { font: 500 16px/1 var(--font-ui); color: var(--bone-dim); letter-spacing: .04em; }
  .wp-wa b { color: var(--bone); font-weight: 700; }
  .wp-qr { position: relative; flex: none; box-shadow: 0 0 0 1px rgba(210, 180, 99, .9), 0 0 0 9px rgba(8, 20, 40, .92),
           0 0 0 10px rgba(210, 180, 99, .55), 0 18px 50px rgba(0, 0, 0, .6), 0 0 60px rgba(255, 122, 26, .18); }
  .wp-qr svg { display: block; }

  .wp-urgent { display: flex; flex-direction: column; gap: 9px; font: 500 19px/1.25 var(--font-ui); color: var(--bone-dim); }
  .wp-urgent .wp-u1 { color: #FFD9A8; font-weight: 700; }
  .wp-urgent .wp-u3 { color: #fff; font-weight: 700; }
  .wp-urgent .wp-u3 b { color: #FF9B7A; font-weight: 700; }
  .wp-flame { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 12px; vertical-align: 2px;
              background: #FFD27A; box-shadow: 0 0 0 3px rgba(255, 122, 26, .28), 0 0 14px 3px rgba(255, 122, 26, .8); }

  .wp-rule { height: 1px; background: linear-gradient(90deg, rgba(210,180,99,.6), rgba(210,180,99,.25) 70%, rgba(210,180,99,0)); }
  .wp-cta { display: inline-flex; align-items: center; gap: 14px; height: 62px; padding: 0 30px 0 32px; border-radius: 999px; box-sizing: border-box;
            font: 800 21px/1 var(--font-ui); letter-spacing: .22em; text-transform: uppercase; color: #1A1204;
            background: linear-gradient(180deg, #F3DE9E 0%, #D2B463 55%, #B0913F 100%);
            box-shadow: 0 0 0 1px rgba(255, 231, 168, .6) inset, 0 10px 30px rgba(0, 0, 0, .45), 0 0 40px rgba(255, 179, 71, .25); }
  .wp-cta svg { display: block; }

  /* ── FEED 1080×1350 ── */
  .wp-f-feed .wp-c { padding: 66px 76px 58px; }
  .wp-f-feed .wp-kick { margin-top: 54px; }
  .wp-f-feed .wp-hook { margin-top: 26px; }
  .wp-f-feed .wp-l-2 { margin-top: 8px; }
  .wp-f-feed .wp-sub { margin-top: 20px; }
  .wp-f-feed .wp-hing { margin-top: 26px; }
  .wp-f-feed .wp-h1 { font-size: 54px; }
  .wp-f-feed .wp-h2 { font-size: 74px; margin-top: 2px; }
  .wp-f-feed .wp-lives { margin-top: 30px; }
  .wp-f-feed .wp-host { margin-top: 14px; }
  .wp-f-feed .wp-ends { margin-top: 6px; }
  .wp-f-feed .wp-triad { margin-top: 16px; margin-bottom: 26px; }
  .wp-f-feed .wp-panel { margin-top: auto; display: grid; grid-template-columns: 1fr auto; column-gap: 40px; align-items: end; }
  .wp-f-feed .wp-date { font-size: 104px; margin-top: 12px; }
  .wp-f-feed .wp-money { margin-top: 18px; }
  .wp-f-feed .wp-urgent { margin-top: 26px; }
  .wp-f-feed .wp-scan-l { margin-bottom: 22px; }
  .wp-f-feed .wp-url { margin-top: 22px; }
  .wp-f-feed .wp-wa { margin-top: 10px; }

  /* ── STORY 1080×1920 ── (top ~200 and bottom ~200 sit under the app's chrome) */
  .wp-f-story .wp-c { padding: 108px 80px 172px; }
  .wp-f-story .wp-top { font-size: 16px; }
  .wp-f-story .wp-kick { margin-top: 44px; font-size: 23px; }
  .wp-f-story .wp-hook { margin-top: 22px; line-height: .8; }
  .wp-f-story .wp-l + .wp-l { margin-top: 10px; }
  .wp-f-story .wp-sub { margin-top: 16px; font-size: 50px; }
  .wp-f-story .wp-hing { margin-top: 26px; }
  .wp-f-story .wp-h1 { font-size: 62px; }
  .wp-f-story .wp-h2 { font-size: 86px; margin-top: 2px; }
  .wp-f-story .wp-lives { margin-top: 32px; font-size: 22px; gap: 14px; letter-spacing: .16em; }
  .wp-f-story .wp-host { margin-top: 12px; font-size: 40px; }
  .wp-f-story .wp-ends { margin-top: 8px; font-size: 25px; }
  .wp-f-story .wp-triad { margin-top: 18px; font-size: 31px; }
  .wp-f-story .wp-panel { margin-top: auto; display: grid; grid-template-columns: 1fr auto; column-gap: 36px; align-items: end; }
  .wp-f-story .wp-date { font-size: 112px; margin-top: 12px; }
  .wp-f-story .wp-money { margin-top: 18px; }
  .wp-f-story .wp-rule { margin-top: 20px; }
  .wp-f-story .wp-urgent { margin-top: 16px; font-size: 21px; gap: 8px; }
  .wp-f-story .wp-scan-l { margin-bottom: 22px; }
  .wp-f-story .wp-url { margin-top: 22px; }
  .wp-f-story .wp-wa { margin-top: 10px; }

  /* ── OG 1200×630 ── (seen at 300–500px wide: hook, date, fee, a door) */
  .wp-f-og .wp-c { padding: 46px 60px 44px; }
  .wp-f-og .wp-top { font-size: 13px; }
  .wp-f-og .wp-row { flex: 1; display: flex; }
  .wp-f-og .wp-left { width: 700px; display: flex; flex-direction: column; }
  .wp-f-og .wp-right { flex: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; padding-left: 44px; }
  .wp-f-og .wp-kick { font-size: 17px; gap: 14px; margin-top: 30px; }
  .wp-f-og .wp-kick::before { width: 40px; }
  .wp-f-og .wp-hook { margin-top: 20px; }
  .wp-f-og .wp-l-2 { margin-top: 6px; }
  .wp-f-og .wp-sub { margin-top: 14px; font-size: 34px; }
  .wp-f-og .wp-wd { font-size: 16px; }
  .wp-f-og .wp-date { font-size: 76px; margin-top: 8px; }
  .wp-f-og .wp-money { margin-top: 14px; gap: 18px; }
  .wp-f-og .wp-money-t > b { font-size: 28px; }
  .wp-f-og .wp-cta { margin-top: 22px; }
  .wp-f-og .wp-url { margin-top: 12px; font-size: 15px; color: var(--bone-dim); }
</style>
</head>
