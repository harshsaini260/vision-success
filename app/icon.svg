<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Vision Success — The Crest (favicon)
       Simplified from components/Logo.js: at 16px only the shield, the
       flame and the star survive, so everything else is dropped and the
       remaining shapes are thickened. -->
  <rect width="120" height="120" rx="24" fill="#07111F"/>

  <!-- shield: navy body -->
  <path d="M60 12 L100 23 V62 C100 85 82 100 60 108 C38 100 20 85 20 62 V23 Z" fill="#1B4F7E"/>
  <!-- silver field -->
  <path d="M60 20 L93 29 V62 C93 81 78 93.5 60 100.5 C42 93.5 27 81 27 62 V29 Z" fill="#E8F0F7"/>
  <!-- gold keyline -->
  <path d="M60 20 L93 29 V62 C93 81 78 93.5 60 100.5 C42 93.5 27 81 27 62 V29 Z" fill="none" stroke="#D4AF37" stroke-width="2.4"/>

  <!-- open book -->
  <path d="M35 63 L58 70 V83 L35 76 Z" fill="#FFFFFF" stroke="#1B4F7E" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M85 63 L62 70 V83 L85 76 Z" fill="#FFFFFF" stroke="#1B4F7E" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M56.5 69 L60 67.5 L63.5 69 V83 L60 84.5 L56.5 83 Z" fill="#1B4F7E"/>

  <!-- torch -->
  <rect x="56.5" y="48" width="7" height="22" rx="2.4" fill="#1B4F7E"/>
  <path d="M52 46 H68 L65.5 52.5 H54.5 Z" fill="#1B4F7E"/>

  <!-- flame -->
  <path d="M60 20 C64.5 28.5 69 32 69 39 C69 45 64.7 49 60 49 C55.3 49 51 45 51 39 C51 32 55.5 28.5 60 20 Z" fill="#D4AF37"/>
  <path d="M60 29 C62.4 33.5 64.4 35.5 64.4 39.3 C64.4 42.6 62.4 44.8 60 44.8 C57.6 44.8 55.6 42.6 55.6 39.3 C55.6 35.5 57.6 33.5 60 29 Z" fill="#FBF3D8"/>

  <!-- arrow of progress -->
  <path d="M37 83 C50 79 63 68 74 50" stroke="#D4AF37" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M69 47 L81 42 L78.5 55 Z" fill="#2E6FA8"/>
</svg>
